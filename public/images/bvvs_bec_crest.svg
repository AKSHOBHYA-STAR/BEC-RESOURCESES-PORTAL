<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="becGoldRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
    <linearGradient id="becNavyRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <radialGradient id="becCrimsonInner" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="70%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </radialGradient>
    <radialGradient id="becFlameGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>
  </defs>

  <!-- Outer Beaded Rim Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#becGoldRim)" stroke="#78350F" stroke-width="2" />
  
  <!-- Outer Navy Ring for B.V.V. SANGHA -->
  <circle cx="100" cy="100" r="86" fill="url(#becNavyRing)" stroke="#F59E0B" stroke-width="2.5" />

  <!-- Curved Text Path: Upper Ring "B.V.V. SANGHA • BAGALKOTE" -->
  <path id="becTextUpper" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" />
  <text fill="#FEF3C7" font-size="10.5" font-weight="900" letter-spacing="2.2" font-family="sans-serif">
    <textPath href="#becTextUpper" startOffset="50%" text-anchor="middle">
      B.V.V. SANGHA • BAGALKOTE
    </textPath>
  </text>

  <!-- Curved Text Path: Lower Ring "ESTD. 1906" -->
  <path id="becTextLower" d="M 166 106 A 68 68 0 0 1 34 106" fill="none" />
  <text fill="#FDE68A" font-size="9.5" font-weight="800" letter-spacing="3" font-family="sans-serif">
    <textPath href="#becTextLower" startOffset="50%" text-anchor="middle">
      ★ ESTD. 1906 ★
    </textPath>
  </text>

  <!-- Inner Crimson Medallion -->
  <circle cx="100" cy="100" r="58" fill="url(#becCrimsonInner)" stroke="#F59E0B" stroke-width="2" />

  <!-- Traditional Nandaa Deepa (Eternal Lamp) & Sacred Flame -->
  <path d="M 86 128 L 114 128 L 110 123 L 90 123 Z" fill="#FDE047" stroke="#78350F" stroke-width="1" />
  <path d="M 74 117 C 82 124 118 124 126 117 C 122 113 78 113 74 117 Z" fill="#FDE047" stroke="#78350F" stroke-width="1.2" />
  <ellipse cx="100" cy="113" rx="14" ry="3" fill="#D97706" />

  <!-- Radiant Multi-tier Sacred Flame -->
  <path d="M 100 70 C 114 84 118 97 114 108 C 110 114 90 114 86 108 C 82 97 86 84 100 70 Z" fill="url(#becFlameGlow)" opacity="0.95" />
  <path d="M 100 77 C 108 87 110 97 108 104 C 105 108 95 108 92 104 C 90 97 92 87 100 77 Z" fill="#FEF08A" />
  <ellipse cx="100" cy="98" rx="4.5" ry="9" fill="#FFFFFF" />

  <!-- College Acronym Banner at Center-Bottom -->
  <rect x="76" y="130" width="48" height="15" rx="3" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2" />
  <text x="100" y="141.5" fill="#FFFFFF" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1.5" font-family="sans-serif">
    B.E.C.
  </text>

  <!-- Autonomous Ribbon Arc along Bottom Outer -->
  <path d="M 44 148 Q 100 178 156 148 L 152 162 Q 100 190 48 162 Z" fill="#B91C1C" stroke="#F59E0B" stroke-width="1" />
  <text x="100" y="161" fill="#FEF3C7" font-size="8" font-weight="800" text-anchor="middle" letter-spacing="1" font-family="sans-serif">
    AUTONOMOUS • 1963
  </text>

  <!-- Sacred Kannada / English Motto Ribbon -->
  <rect x="36" y="168" width="128" height="15" rx="4" fill="#0F172A" stroke="#FBBF24" stroke-width="1.2" />
  <text x="100" y="179" fill="#FDE047" font-size="7.8" font-weight="900" text-anchor="middle" letter-spacing="0.8" font-family="sans-serif">
    ಕಾಯಕವೇ ಕೈಲಾಸ • WORK IS WORSHIP
  </text>
</svg>
